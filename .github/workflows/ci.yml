# Intégration continue : lint, tests, build strict et tests de bout en bout sur chaque demande
# de fusion (et sur main après fusion). Gratuit pour un dépôt public.
# Actions sur Node 24 (Node 20 retiré des runners). Ubuntu épinglé (pas ubuntu-latest) : une
# nouvelle version d'Ubuntu peut casser les dépendances système de Playwright/WebKit ; la
# remonter à la main (voir docs/journal.md, 2026-10-06, maintenance CI).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualite:
    name: Lint, tests, build, bout en bout
    runs-on: ubuntu-24.04
    # 30 min : filet de sécurité (l'installation des navigateurs a déjà pris 18 min sans cache).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Version de pnpm lue dans le champ packageManager de package.json.
      - uses: pnpm/action-setup@v6

      # Version de Node lue dans .nvmrc (24), comme Cloudflare Pages ; package.json la
      # demande aussi (engines).
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Tests unitaires
        run: pnpm test

      # Mode strict, comme au lancement : aucune donnée fictive, mentions légales remplies,
      # noms anglais, contraste des ciels, gabarits « Le savais-tu ? » (scripts/check-data.ts).
      - name: Build strict (export statique)
        run: pnpm build
        env:
          STRICT_DATA: "1"

      # Navigateurs Playwright en cache : clé = système du runner (Linux, image ubuntu24) +
      # version exacte de @playwright/test installée. Une mise à jour de Playwright change la
      # clé : la première CI qui suit retélécharge tout (plus lente, c'est normal).
      - name: Version de Playwright
        id: playwright
        run: |
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "image=$ImageOS" >> "$GITHUB_OUTPUT"

      - name: Cache des navigateurs Playwright
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.image }}-${{ steps.playwright.outputs.version }}

      - name: Navigateurs Playwright (installation complète)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium webkit

      # Navigateurs déjà là : seules les dépendances système (paquets apt) restent à poser.
      - name: Navigateurs Playwright (dépendances système seulement)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium webkit

      - name: Tests de bout en bout (Chromium, WebKit)
        run: pnpm e2e

      - name: Rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

      # Toujours conservé : un test réussi au second essai garde ses pièces jointes
      # (erreurs-console.txt) du premier.
      - name: Rapport Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
