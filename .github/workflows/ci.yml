# Intégration continue : lint, tests, build strict et tests de bout en bout sur chaque demande
# de fusion (et sur main après fusion). Gratuit pour un dépôt public.
# Actions sur Node 24 (Node 20 retiré des runners). Ubuntu épinglé (pas ubuntu-latest) : une
# nouvelle version d'Ubuntu peut casser les dépendances système de Playwright/WebKit ; la
# remonter à la main (voir docs/journal.md, 2026-10-06, maintenance CI).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualite:
    name: Lint, tests, build, bout en bout
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Version de pnpm lue dans le champ packageManager de package.json.
      - uses: pnpm/action-setup@v6

      # Version de Node lue dans .nvmrc (24), comme Cloudflare Pages ; package.json la
      # demande aussi (engines).
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Tests unitaires
        run: pnpm test

      # Mode strict, comme au lancement : aucune donnée fictive, mentions légales remplies,
      # noms anglais, contraste des ciels, gabarits « Le savais-tu ? » (scripts/check-data.ts).
      - name: Build strict (export statique)
        run: pnpm build
        env:
          STRICT_DATA: "1"

      - name: Navigateurs Playwright
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Tests de bout en bout (Chromium, WebKit)
        run: pnpm e2e

      - name: Rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

      # Toujours conservé : un test réussi au second essai garde ses pièces jointes
      # (erreurs-console.txt) du premier.
      - name: Rapport Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
